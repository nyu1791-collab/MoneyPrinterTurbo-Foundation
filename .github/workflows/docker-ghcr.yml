name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly publish a container to this fork's GHCR namespace
        type: boolean
        default: false
      mirror:
        description: Dependency mirror route to validate
        type: choice
        options: [default, china]
        default: default
      platforms:
        description: CPU architectures to build (single architecture for mirror checks)
        type: choice
        options: ["linux/amd64,linux/arm64", "linux/amd64"]
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build (publishing requires explicit input)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.publish }}
          provenance: mode=max
          sbom: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            DOCKER_BUILD_MIRROR=${{ inputs.mirror || 'default' }}
            PIP_USE_OFFICIAL=${{ inputs.mirror == 'china' && '0' || '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
