name: Optional Windows check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: English production basics
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Check selected behavior without external API requests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_fast_youtube_workflow.py
          test/services/test_multilingual.py
          test/services/test_edge_atomic_audio.py
          test/services/test_edge_backpressure.py
          test/services/test_material_cache.py
